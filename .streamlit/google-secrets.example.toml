# Testing app: staging_app.py. Configure each app separately in Cloud Secrets.
# For the management app, set deployment.environment = "admin" and main file approval_app.py.
[deployment]
environment = "staging"

[access]
login_method = "google"

[auth]
redirect_uri = "https://YOUR-TEST-APP.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"

[auth.google]
client_id = "REPLACE_WITH_GOOGLE_WEB_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
client_kwargs = { scope = "openid email profile", prompt = "select_account" }

[authorization]
admin_emails = ["owner@example.com"]

[approval_db]
# Private server-side PostgreSQL URL, not a public Supabase anon key.
url = "postgresql+psycopg://DB_USER:DB_PASSWORD@DB_HOST:5432/DB_NAME"
